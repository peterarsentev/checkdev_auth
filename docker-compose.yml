name: checkdev-auth

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cd_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cd_auth"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  auth-postgres-data:
    name: checkdev-auth-postgres-data
