server.port=${SERVER_PORT:9900}
spring.application.name=auth

auth.public-url=${AUTH_PUBLIC_URL:http://localhost:9900}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cd_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/db.changelog-master.xml
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

springdoc.paths-to-match=/registration,/login,/user,/ping
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false

logging.level.ru.checkdev=INFO
