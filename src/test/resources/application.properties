spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE,SHOW}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${TEST_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/db.changelog-master.xml
auth.public-url=http://localhost:9900
springdoc.paths-to-match=/registration,/login,/user,/ping

spring.test.database.replace=none
