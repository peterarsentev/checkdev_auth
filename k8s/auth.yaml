apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: checkdev-course
data:
  SERVER_PORT: "9900"
  AUTH_PUBLIC_URL: "http://localhost:9900"
  DB_URL: "jdbc:postgresql://auth-db:5432/cd_auth"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: checkdev-course
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 9900
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: checkdev-course
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: checkdev-auth:lesson-1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 9900
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-db-credentials
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: "1"
